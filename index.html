<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beli Tupperware Bersama Ibu 🫧</title>

<style>
    body {
        margin: 0;
        font-family: 'Comic Sans MS', cursive;
        background: linear-gradient(to bottom, #4facfe, #00f2fe);
        color: white;
        text-align: center;
        overflow: hidden;
    }

    h1 {
        margin-top: 60px;
        font-size: 2.5em;
    }

    p {
        font-size: 1.2em;
    }

    .container {
        margin-top: 40px;
    }

    button {
        padding: 15px 30px;
        margin: 20px;
        font-size: 1.2em;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
    }

    #yesBtn {
        background-color: #28a745;
        color: white;
    }

    #noBtn {
        background-color: #dc3545;
        color: white;
        position: absolute;
    }

    button:hover {
        transform: scale(1.1);
    }

    .character {
        font-size: 3em;
        margin-top: 20px;
        animation: float 3s infinite ease-in-out;
    }

    @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
        100% { transform: translateY(0px); }
    }

    #message {
        margin-top: 30px;
        font-size: 1.5em;
        display: none;
    }
</style>
</head>

<body>

<h1>🌊 Petualangan Laut Bersama Ibu 🫧</h1>

<div class="character">
    🐬 🐚 🐴
</div>

<p>Kuda laut & lumba-lumba bilang...</p>
<h2>Mau beli Tupperware bersama Ibu? 🥺</h2>

<div class="container">
    <button id="yesBtn">YES 💖</button>
    <button id="noBtn">NO 😈</button>
</div>

<div id="message">
    🥳 Yeyy! Kamu anak baik! Ibu senang 💙
</div
